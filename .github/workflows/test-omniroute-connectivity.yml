name: OmniRoute Connectivity Test

on:
  push:
    branches:
      - test/github-omniroute-connectivity

jobs:
  connectivity-test:
    name: OmniRoute Local Connectivity
    runs-on: [self-hosted, strikenova-ocr-local]

    steps:
      - name: Check runner identity
        shell: cmd
        run: |
          @echo off
          echo ## Runner Identity >> "%GITHUB_STEP_SUMMARY%"
          echo - **Name:** %COMPUTERNAME% >> "%GITHUB_STEP_SUMMARY%"
          powershell -Command "[System.Environment]::OSVersion.ToString()" > "%TEMP%\_os.txt"
          set /p _OS=<"%TEMP%\_os.txt"
          echo - **OS:** %_OS% >> "%GITHUB_STEP_SUMMARY%"
          echo Runner: %COMPUTERNAME% started

      - name: Test 1 - localhost:20128 reachability
        id: test1
        shell: cmd
        run: |
          @echo off
          curl.exe --noproxy "*" -s -o NUL -w "%%{http_code}" --max-time 10 http://localhost:20128/ > "%TEMP%\test1_code.txt"
          if errorlevel 1 (
            echo "http_code=000" >> "%GITHUB_OUTPUT%"
            echo "result=UNREACHABLE" >> "%GITHUB_OUTPUT%"
            echo ERROR: curl failed
            exit /b 1
          )
          set /p HTTP_CODE=<"%TEMP%\test1_code.txt"
          if "%HTTP_CODE%"=="" set HTTP_CODE=000
          echo "http_code=%HTTP_CODE%" >> "%GITHUB_OUTPUT%"
          if "%HTTP_CODE%"=="307" (
            echo "result=REACHABLE" >> "%GITHUB_OUTPUT%"
            echo localhost:20128 reachable (HTTP 307)
            exit /b 0
          )
          if "%HTTP_CODE%"=="200" (
            echo "result=REACHABLE" >> "%GITHUB_OUTPUT%"
            echo localhost:20128 reachable (HTTP 200)
            exit /b 0
          )
          echo "result=UNREACHABLE" >> "%GITHUB_OUTPUT%"
          echo ERROR: localhost:20128 returned HTTP %HTTP_CODE%
          exit /b 1

      - name: Test 2 - shahid-combo chat completions
        id: test2
        shell: cmd
        run: |
          @echo off
          powershell -NoProfile -ExecutionPolicy Bypass -Command ^
          "$body='{\"model\":\"shahid-combo\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly: OK\"}],\"max_tokens\":5,\"temperature\":0}'; ^
          $headers=@{'Content-Type'='application/json';'Authorization'='Bearer sk-local-connectivity-test'}; ^
          try { ^
            $response=Invoke-RestMethod -Uri 'http://localhost:20128/v1/chat/completions' -Method Post -Headers $headers -Body $body -TimeoutSec 30 -MaximumRetryCount 0; ^
            if($response.error){ ^
              Add-Content -Path $env:GITHUB_OUTPUT -Value 'http_code=200'; ^
              Add-Content -Path $env:GITHUB_OUTPUT -Value 'result=REJECTED'; ^
              Write-Host 'ERROR: OmniRoute returned error: ' + $response.error.message -ForegroundColor Red; ^
              exit 1 ^
            }; ^
            $content=$response.choices[0].message.content; ^
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'http_code=200'; ^
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'result=ACCEPTED'; ^
            Add-Content -Path $env:GITHUB_OUTPUT -Value ('response_preview=' + $content); ^
            Write-Host 'shahid-combo accepted (HTTP 200): ' + $content ^
          } catch { ^
            $httpCode=0; ^
            if($_.Exception.Response){$httpCode=[int]$_.Exception.Response.StatusCode}; ^
            Add-Content -Path $env:GITHUB_OUTPUT -Value ('http_code=' + $httpCode); ^
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'result=REJECTED'; ^
            Write-Host 'ERROR: shahid-combo returned HTTP ' + $httpCode -ForegroundColor Red; ^
            exit 1 ^
          }"

      - name: Summary
        if: always()
        shell: cmd
        run: |
          @echo off
          setlocal enabledelayedexpansion
          set "TEST2_ACCEPTED=NO"
          echo %TEST2_RESULT% | findstr /i "ACCEPTED" >nul && set "TEST2_ACCEPTED=YES"
          echo ## OmniRoute Connectivity Test Results >> "%GITHUB_STEP_SUMMARY%"
          echo. >> "%GITHUB_STEP_SUMMARY%"
          echo ^| Check ^| Result ^| >> "%GITHUB_STEP_SUMMARY%"
          echo ^|-------^|--------^| >> "%GITHUB_STEP_SUMMARY%"
          echo ^| Runner name ^| %COMPUTERNAME% ^| >> "%GITHUB_STEP_SUMMARY%"
          powershell -Command "[System.Environment]::OSVersion.ToString()" > "%TEMP%\_os.txt"
          set /p _OS=<"%TEMP%\_os.txt"
          echo ^| Runner OS ^| %_OS% ^| >> "%GITHUB_STEP_SUMMARY%"
          echo ^| localhost:20128 reachable ^| %TEST1_RESULT% (HTTP %TEST1_CODE%) ^| >> "%GITHUB_STEP_SUMMARY%"
          echo ^| /v1/chat/completions reachable ^| %TEST2_RESULT% (HTTP %TEST2_CODE%) ^| >> "%GITHUB_STEP_SUMMARY%"
          echo ^| shahid-combo accepted ^| %TEST2_ACCEPTED% ^| >> "%GITHUB_STEP_SUMMARY%"
          echo. >> "%GITHUB_STEP_SUMMARY%"
          echo ^> **Note:** No real API key used. Placeholder bearer only (OmniRoute accepts any bearer on chat path by default). No secrets printed. >> "%GITHUB_STEP_SUMMARY%"
