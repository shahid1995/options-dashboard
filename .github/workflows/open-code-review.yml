name: OpenCodeReview PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  open-code-review:
    name: OpenCodeReview Analysis
    runs-on: ubuntu-latest
    
    # SECURITY: Gate automatic PR reviews to prevent abuse of the OpenRouter credential.
    # 
    # Automatic reviews run only when:
    # 1. PR is internal (not from a fork), OR
    # 2. PR is from a fork but the author is a trusted repository member
    #    (OWNER, MEMBER, or COLLABORATOR)
    # 3. issue_comment events pass the trusted-author and trigger-phrase checks
    #    and are attached to a pull request
    #
    # Untrusted external fork PRs do NOT trigger automatic reviews, but a trusted
    # user can manually trigger /open-code-review on any PR.
    if: |
      (
        github.event_name == 'pull_request_target' &&
        (
          github.event.pull_request.head.repo.fork == false ||
          (
            github.event.pull_request.author_association == 'OWNER' ||
            github.event.pull_request.author_association == 'MEMBER' ||
            github.event.pull_request.author_association == 'COLLABORATOR'
          )
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.type != 'Bot' &&
        (
          github.event.comment.body == '/open-code-review' ||
          github.event.comment.body == '@open-code-review'
        ) &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    
    permissions:
      contents: read
      pull-requests: write
    
    concurrency:
      group: open-code-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    
    steps:
      # For issue_comment events, resolve the commented PR's metadata.
      # This step uses the GitHub API (not PR code checkout) to obtain:
      # - PR number
      # - base branch ref
      # - current head SHA
      # These are passed to the OpenCodeReview action for the manual review path.
      # This step does NOT checkout or execute PR-controlled code.
      - name: Resolve PR refs for manual trigger
        if: github.event_name == 'issue_comment'
        id: resolve-pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('pr_number', prNumber);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);
      
      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@bccbc15f785269400735d5255540c231e6c02b6d # v1.12.9
        with:
          # Pin OCR CLI version for reproducibility
          ocr_version: '1.12.9'
          
          # OpenRouter LLM configuration (secrets/variables configured in repo settings)
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          llm_protocol: openai
          
          # For issue_comment events, use the resolved PR metadata from the previous step.
          # For pull_request_target events, these are empty strings and the action uses
          # its own defaults from the event payload.
          pr_number: ${{ steps.resolve-pr.outputs.pr_number }}
          base_ref: ${{ steps.resolve-pr.outputs.base_ref }}
          head_sha: ${{ steps.resolve-pr.outputs.head_sha }}
          
          # Review quality
          effort: high
          review_concurrency: 5
          
          # Non-destructive incremental review
          sticky_summary: 'true'
          incremental: 'true'
          incremental_overlap_threshold: '0.6'
          
          # Progress and artifacts
          stream_progress: 'true'
          upload_artifacts: 'true'
          
          # Custom rules for StrikeNova
          rule: .github/open-code-review-rules.json
          
          # GitHub token for posting comments
          github_token: ${{ github.token }}
          
          # Timeouts
          llm_timeout: '300'
          review_task_timeout: '15'
