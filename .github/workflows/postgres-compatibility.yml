name: PostgreSQL compatibility

on:
  push:
    paths:
      - "options-dashboard-project/backend/**"
      - ".github/workflows/postgres-compatibility.yml"
  pull_request:
    paths:
      - "options-dashboard-project/backend/**"
      - ".github/workflows/postgres-compatibility.yml"

jobs:
  postgres-compatibility:
    name: Backend PostgreSQL compatibility
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: strikenova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d strikenova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: options-dashboard-project/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run PostgreSQL compatibility and migration safety tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/strikenova_test
        run: >-
          python -m pytest -q
          tests/test_postgres_compatibility.py
          tests/test_sqlite_postgres_migration.py
          tests/test_migrate_sqlite_to_postgres.py
          tests/test_rehearsal_ci_database.py
          tests/test_migration_hardening.py
          tests/test_migration_failure_injection.py
          tests/test_migration_large_rehearsal.py
          tests/test_day5_alembic_authority.py
          tests/test_day6_performance_baseline.py
          tests/test_migration_rehearsal_postgres.py
