name: PostgreSQL compatibility

on:
  push:
    paths:
      - "options-dashboard-project/backend/**"
      - ".github/workflows/postgres-compatibility.yml"
  pull_request:
    paths:
      - "options-dashboard-project/backend/**"
      - ".github/workflows/postgres-compatibility.yml"

jobs:
  postgres-compatibility:
    name: Backend PostgreSQL compatibility
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned digest of postgres:16.16 so the compatibility suites build
        # their schemas on the acceptance version (server_version_num 160016).
        image: postgres@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: strikenova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d strikenova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: options-dashboard-project/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Require PostgreSQL 16.16 exactly
        env:
          ISSUE145_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["ISSUE145_PG_ADMIN_URL"]) as conn:
              banner = conn.execute("SHOW server_version").fetchone()[0]
              num = int(conn.execute("SHOW server_version_num").fetchone()[0])
          print("server_version:", banner)
          if num != 160016:
              raise SystemExit(f"expected PostgreSQL 16.16 (160016), got {num}")
          PY

      # The suites below build their schemas through
      # ``python -m app.migrate upgrade head`` against disposable, uniquely
      # named databases/roles provisioned from ISSUE145_PG_ADMIN_URL. The
      # admin URL is used only to CREATE/DROP those resources and to seed the
      # import fixtures: no test engine connects as the cluster superuser.
      # The exit status is captured first and the step ends with `exit 0` only
      # so the gate step below can always run; the gate is what decides the
      # job outcome.
      - name: Run PostgreSQL compatibility and migration safety tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/strikenova_test
          ISSUE145_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set +e
          python -m pytest -q -rs \
              tests/test_postgres_compatibility.py \
              tests/test_sqlite_postgres_migration.py \
              tests/test_migrate_sqlite_to_postgres.py \
              tests/test_rehearsal_ci_database.py \
              tests/test_migration_hardening.py \
              tests/test_migration_failure_injection.py \
              tests/test_migration_large_rehearsal.py \
              tests/test_day5_alembic_authority.py \
              tests/test_day6_performance_baseline.py \
              --junitxml=postgres-compatibility.xml > postgres-compatibility.log 2>&1
          echo "$?" > postgres-compatibility.rc
          exit 0

      # A suite that skipped everything would also exit 0. This gate fails the
      # job on a non-zero pytest status, on any skipped test, or when the
      # passing count is lower than the suite's real size.
      - name: Gate on the actual test results (no false green)
        if: always()
        run: |
          set -uo pipefail
          rc=$(cat postgres-compatibility.rc 2>/dev/null || echo missing)
          echo "pytest exit status: $rc"
          tail -n 40 postgres-compatibility.log 2>/dev/null || echo "no log produced"
          if [ "$rc" != "0" ]; then
            echo "::error::the PostgreSQL compatibility suite failed (exit $rc)"
            exit 1
          fi
          if grep -qE "[0-9]+ (failed|error)" postgres-compatibility.log; then
            echo "::error::the suite reported failures or errors"
            exit 1
          fi
          if grep -qE "[0-9]+ skipped" postgres-compatibility.log; then
            echo "::error::the suite skipped tests (PostgreSQL provisioning is not optional)"
            exit 1
          fi
          passed=$(grep -oE "[0-9]+ passed" postgres-compatibility.log | head -n1 | cut -d' ' -f1)
          echo "passed tests: ${passed:-0}"
          if [ -z "${passed:-}" ] || [ "$passed" -lt 120 ]; then
            echo "::error::unexpectedly few passing tests (${passed:-0} < 120)"
            exit 1
          fi

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-compatibility-evidence
          path: |
            options-dashboard-project/backend/postgres-compatibility.log
            options-dashboard-project/backend/postgres-compatibility.xml
            options-dashboard-project/backend/postgres-compatibility.rc
          if-no-files-found: warn
          retention-days: 14

      - name: Drop leftover test databases and roles
        if: always()
        env:
          ISSUE145_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          python - <<'PY'
          import os
          import psycopg

          try:
              with psycopg.connect(os.environ["ISSUE145_PG_ADMIN_URL"], autocommit=True) as conn:
                  dbs = [r[0] for r in conn.execute(
                      "SELECT datname FROM pg_database WHERE datname LIKE 'sn145\\_%'"
                  )]
                  for db in dbs:
                      conn.execute(
                          "SELECT pg_terminate_backend(pid) FROM pg_stat_activity "
                          "WHERE datname = %s AND pid <> pg_backend_pid()", (db,)
                      )
                      conn.execute(f'DROP DATABASE IF EXISTS "{db}"')
                  roles = [r[0] for r in conn.execute(
                      "SELECT rolname FROM pg_roles WHERE rolname LIKE 'sn145\\_%'"
                  )]
                  for role in roles:
                      conn.execute(f'DROP ROLE IF EXISTS "{role}"')
                  print(f"cleanup: dropped {len(dbs)} database(s), {len(roles)} role(s)")
          except Exception as exc:  # noqa: BLE001 - cleanup must not mask results
              print(f"cleanup skipped: {type(exc).__name__}")
          PY
