name: Database migration rehearsal (PostgreSQL + CockroachDB)

on:
  push:
    paths:
      - "options-dashboard-project/backend/**"
      - ".github/workflows/postgres-migration-rehearsal.yml"
  pull_request:
    paths:
      - "options-dashboard-project/backend/**"
      - ".github/workflows/postgres-migration-rehearsal.yml"

permissions:
  contents: read

jobs:
  postgres-migration-rehearsal:
    name: PostgreSQL migration rehearsal (resolver + ADR-017 lock)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: strikenova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d strikenova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: options-dashboard-project/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run migration rehearsal against real PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/strikenova_test
        run: >-
          python -m pytest -q
          tests/test_migration_rehearsal_postgres.py

  cockroachdb-migration-rehearsal:
    name: CockroachDB migration rehearsal (ADR-017 lock on real CRDB)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: options-dashboard-project/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start disposable CockroachDB (single node, insecure, scratch)
        run: |
          # Exactly the documented quickstart: start-single-node --insecure.
          # Any --listen-addr/--advertise-addr override makes v25.2 reject
          # the startup ("hostname of listen_addr must be 127.0.0.1 or
          # localhost" / "unknown flag: --advertise-addr"); the container's
          # default binding + Docker port publishing already serve 26257.
          docker run -d --name crdb \
            -p 26257:26257 -p 8080:8080 \
            cockroachdb/cockroach:v25.2.23 \
            start-single-node --insecure
          ok=""
          for i in $(seq 1 30); do
            if docker exec crdb /cockroach/cockroach sql --insecure \
                 --host=localhost:26257 -e "SELECT 1" >/dev/null 2>&1; then
              ok=1
              echo "CockroachDB ready"
              break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::CockroachDB did not become ready; container logs:"
            docker logs crdb 2>&1 | tail -80
            exit 1
          fi
          docker exec crdb /cockroach/cockroach sql --insecure \
            --host=localhost:26257 -e "CREATE DATABASE IF NOT EXISTS rehearsal"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Create secondary rehearsal database (identity-coupling evidence)
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://root@127.0.0.1:26257/defaultdb", autocommit=True
          ) as conn:
              conn.execute("CREATE DATABASE IF NOT EXISTS rehearsal_runtime")
          print("rehearsal_runtime database ready")
          PY

      - name: Run migration rehearsal against real CockroachDB
        env:
          TEST_COCKROACHDB_URL: cockroachdb+psycopg://root@127.0.0.1:26257/rehearsal?sslmode=disable
          TEST_COCKROACHDB_RUNTIME_URL: cockroachdb+psycopg://root@127.0.0.1:26257/rehearsal_runtime?sslmode=disable
        run: >-
          python -m pytest -q
          tests/test_migration_rehearsal_cockroachdb.py
